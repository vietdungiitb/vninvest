# docker-compose.dev.yml
# Override file cho local dev testing.
# Setup: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

name: vninvest-dev

services:
  db:
    container_name: vninvest-dev-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vninvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose port 5432 lΩn host d? backend local (hybrid mode) ho?c stack khßc connect du?c.
      # C≤ th? set DEV_BIND_HOST=0.0.0.0 khi c?n cross-stack qua host.docker.internal.
      - "${DEV_BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vninvest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}

  redis:
    container_name: vninvest-dev-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Expose Redis cho backend local (hybrid mode), admin stats, ho?c stack khßc.
      - "${DEV_BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.75}

  mailpit:
    container_name: vninvest-dev-mailpit
    image: axllent/mailpit:latest
    networks:
      - vninvest_network


  core-api:
    container_name: vninvest-dev-core-api
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      CORE_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      PYTHONPATH: /workspace/src
      LEGACY_BACKEND_URL: http://backend:8000
      LEGACY_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
    command: >
      sh -c "apt-get update -y && apt-get install -y git &&
      pip install -r requirements.txt -q &&
      python manage.py migrate --noinput &&
      python -m gunicorn vninvest_core.wsgi:application
      --bind 0.0.0.0:8100
      --workers 2
      --timeout 60
      --access-logfile -"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8100/core/v1/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "0.0.0.0:8001:8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-1g}
    cpus: ${CORE_API_CPUS:-1.0}

  core-worker:
    container_name: vninvest-dev-core-worker
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      PYTHONPATH: /workspace/src
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      CORE_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:-dev-pat-pepper-replace-in-production}
      LEGACY_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
    command: >
      sh -c "apt-get update -y && apt-get install -y git &&
      pip install -r requirements.txt -q &&
      python -m celery -A vninvest_core worker
      --loglevel=INFO
      --concurrency=2
      --without-heartbeat
      --without-gossip
      --without-mingle"
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-beat:
    container_name: vninvest-dev-core-beat
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      PYTHONPATH: /workspace/src
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      CORE_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:-dev-pat-pepper-replace-in-production}
      LEGACY_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
    command: >
      sh -c "apt-get update -y && apt-get install -y git &&
      pip install -r requirements.txt -q &&
      python -m celery -A vninvest_core beat
      --loglevel=INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  # SFI-B1: Legacy backend hidden behind core-api proxy.
  # No ports exposed to the host. Single entry point is now core-api.
  backend:
    container_name: vninvest-dev-backend-legacy
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-django-secret-key}
      DB_ENGINE: postgres
      POSTGRES_DB: vninvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
    command: >
      sh -c "apt-get update -y && apt-get install -y git &&
      pip install -r requirements.txt -q &&
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: 512m
    cpus: 0.5

  opencore-site:
    container_name: vninvest-dev-opencore-site
    build:
      context: .
      dockerfile: packages/opencore-site/Dockerfile.dev
    ports:
      - "${OPENCORE_SITE_PORT:-3007}:3007"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: ${OPENCORE_SITE_MEM_LIMIT:-512m}
    cpus: ${OPENCORE_SITE_CPUS:-0.5}
    env_file: ./compose.dev.env
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  frontend:
    container_name: vninvest-dev-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev-package-shell
      args:
        REACT_APP_API_BASE_URL: /api
        REACT_APP_AI_ADVISORY_PATH: /ai-advisory
        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "0"
        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
    depends_on: !override
      # SFI-B1.6: frontend depends only on core-api (single entry point); backend is internal.
      core-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}


volumes:
  postgres_data:
    external: true
    name: vninvest-dev_postgres_data
  redis_data:
    external: true
    name: vninvest-dev_redis_data

networks:
  vninvest_network:
    name: vninvest-dev_vninvest_network
    driver: bridge
