# docker-compose.dev.yml
# Override file cho local dev testing.
# Setup: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

name: vninvest-dev

services:
  db:
    container_name: vninvest-dev-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vninvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose port 5432 lΩn host d? backend local (hybrid mode) ho?c stack khßc connect du?c.
      # C≤ th? set DEV_BIND_HOST=0.0.0.0 khi c?n cross-stack qua host.docker.internal.
      - "${DEV_BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vninvest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}

  redis:
    container_name: vninvest-dev-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Expose Redis cho backend local (hybrid mode), admin stats, ho?c stack khßc.
      - "${DEV_BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.75}

  mailpit:
    container_name: vninvest-dev-mailpit
    image: axllent/mailpit:latest
    networks:
      - vninvest_network


  core-api:
    container_name: vninvest-dev-core-api
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      PYTHONPATH: /workspace/src
      LEGACY_BACKEND_URL: ${LEGACY_BACKEND_URL:?LEGACY_BACKEND_URL must be set in compose.dev.env}
      LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL:?LEGACY_DATABASE_URL must be set in compose.dev.env}
    entrypoint: []
    command:
      - sh
      - -c
      - >-
        apt-get update && apt-get install -y git &&
        pip install -r requirements.txt -q &&
        python manage.py migrate --noinput &&
        python -m daphne --bind 0.0.0.0 --port 8100 vninvest_core.asgi:application
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s
    ports:
      - "0.0.0.0:8001:8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-1g}
    cpus: ${CORE_API_CPUS:-1.0}

  core-worker:
    container_name: vninvest-dev-core-worker
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      PYTHONPATH: /workspace/src
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_QUEUES: celery,realtime_prefetch,realtime_stream,analytics_heavy,manual_on_demand
      CORE_DATABASE_URL: postgres://postgres:devpassword@db:5432/vninvest
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:-dev-pat-pepper-replace-in-production}
      LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL:?LEGACY_DATABASE_URL must be set in compose.dev.env}
    entrypoint: []
    command:
      - sh
      - -c
      - >-
        apt-get update && apt-get install -y git &&
        pip install -r requirements.txt -q &&
        python -m celery -A vninvest_core worker --loglevel=INFO --concurrency=2 --queues="$${CELERY_QUEUES}" --without-heartbeat --without-gossip --without-mingle
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-worker-realtime-prefetch:
