# docker-compose.dev.yml
# Override file cho local dev testing.
# Setup: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

name: vninvest-dev

services:
  db:
    container_name: vninvest-dev-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vninvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose port 5432 lΩn host d? backend local (hybrid mode) ho?c stack khßc connect du?c.
      # C≤ th? set DEV_BIND_HOST=0.0.0.0 khi c?n cross-stack qua host.docker.internal.
      - "${DEV_BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vninvest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}

  redis:
    container_name: vninvest-dev-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Expose Redis cho backend local (hybrid mode), admin stats, ho?c stack khßc.
      - "${DEV_BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.75}

  mailpit:
    container_name: vninvest-dev-mailpit
    image: axllent/mailpit:latest
    networks:
      - vninvest_network

  core-api:
    container_name: vninvest-dev-core-api
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: foundation
      CORE_API_PORT: "8100"
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.api_stub"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8100/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-256m}
    cpus: ${CORE_API_CPUS:-0.5}

  core-worker:
    container_name: vninvest-dev-core-worker
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: foundation
      CORE_STUB_INTERVAL_SECONDS: "30"
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.worker_stub"]
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-beat:
    container_name: vninvest-dev-core-beat
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: foundation
      CORE_STUB_INTERVAL_SECONDS: "30"
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.beat_stub"]
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  backend:
    container_name: vninvest-dev-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.dev
    environment:
      # Override endpoint runtime d? trßnh ph? thu?c c?ng vαo DNS service name khi ch?y cross-stack.
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      VNSTOCK_HISTORY_SOURCE: ${VNSTOCK_HISTORY_SOURCE:-KBS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
    command: ["/bin/sh", "/app/entrypoint.sh"]
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vninvest_network
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.0}

  celery_worker:
    container_name: vninvest-dev-celery-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.dev
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      VNSTOCK_HISTORY_SOURCE: ${VNSTOCK_HISTORY_SOURCE:-KBS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-1200m}
    cpus: ${CELERY_WORKER_CPUS:-1.5}

  celery_beat:
    container_name: vninvest-dev-celery-beat
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.dev
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      VNSTOCK_HISTORY_SOURCE: ${VNSTOCK_HISTORY_SOURCE:-KBS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-512m}
    cpus: ${CELERY_BEAT_CPUS:-0.5}

  frontend:
    container_name: vninvest-dev-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev-package-shell
      args:
        REACT_APP_API_BASE_URL: /api
        REACT_APP_AI_ADVISORY_PATH: /ai-advisory
        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
    depends_on:
      backend:
        condition: service_healthy
      core-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vninvest_network
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}


volumes:
  postgres_data:
    external: true
    name: vninvest-dev_postgres_data
  redis_data:
    external: true
    name: vninvest-dev_redis_data

networks:
  vninvest_network:
    name: vninvest-dev_vninvest_network
    driver: bridge
