rvice_healthy`n    healthcheck:`n      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]`n      interval: 10s`n      timeout: 5s`n      retries: 5`n    expose:`n      - "6432"`n    networks:`n      - vninvest_network`n    mem_limit: ${PGBOUNCER_MEM_LIMIT:-64m}`n    cpus: ${PGBOUNCER_CPUS:-0.25}`n`n  # SM-P5.2: Prometheus monitoring`n  prometheus:`n    image: prom/prometheus:latest`n    container_name: vninvest-prometheus`n    restart: unless-stopped`n    command:`n      - "--config.file=/etc/prometheus/prometheus.yml"`n      - "--storage.tsdb.path=/prometheus"`n      - "--storage.tsdb.retention.time=30d"`n      - "--web.enable-lifecycle"`n    volumes:`n      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro`n      - prometheus_data:/prometheus`n    expose:`n      - "9090"`n    networks:`n      - vninvest_network`n    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}`n    cpus: ${PROMETHEUS_CPUS:-0.5}`n`n  # SM-P5.2: Grafana dashboards`n  grafana:`n    image: grafana/grafana:latest`n    container_name: vninvest-grafana`n    restart: unless-stopped`n    environment:`n      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}`n      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}`n      GF_INSTALL_PLUGINS: grafana-piechart-panel`n      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}`n      GF_ANALYTICS_REPORTING_ENABLED: "false"`n    volumes:`n      - grafana_data:/var/lib/grafana`n      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro`n      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro`n    depends_on:`n      - prometheus`n    expose:`n      - "3000"`n    networks:`n      - vninvest_network`n    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}`n    cpus: ${GRAFANA_CPUS:-0.25}`n`n  frontend:`n    build:`n      context: .`n      dockerfile: frontend/Dockerfile.dev-package-shell`n      secrets:`n        - vnbroker_github_token`n      args:`n        REACT_APP_API_BASE_URL: /api`n        APP_RELEASE: ${APP_RELEASE:-main-local}`n        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"`n        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1`n    container_name: vninvest-frontend`n    restart: unless-stopped`n    environment:`n      APP_RELEASE: ${APP_RELEASE:-main-local}`n      REACT_APP_API_BASE_URL: /api`n      REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"`n      REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1`n      VIRTUAL_HOST: ${DOMAIN:-vninvest.edusuccess.vn}`n      VIRTUAL_PORT: "80"`n      LETSENCRYPT_HOST: ${DOMAIN:-vninvest.edusuccess.vn}`n      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@edusuccess.vn}`n    depends_on:`n      backend:`n        condition: service_healthy`n      core-api:`n        condition: service_healthy`n    labels:`n      com.vninvest.release: ${APP_RELEASE:-main-local}`n    expose:`n      - "80"`n    networks:`n      - vninvest_network`n      - nginx-proxy_default`n    mem_limit: ${FRONTEND_MEM_LIMIT:-750m}`n    cpus: ${FRONTEND_CPUS:-0.75}`n`nvolumes:`n  postgres_data:`n  core_pgdata:`n  core_redis_data:`n  prometheus_data:`n  grafana_data:`n`nsecrets:`n  vnbroker_github_token:`n    environment: VNBROKER_GITHUB_TOKEN`n`nnetworks:`n  vninvest_network:`n    driver: bridge`n  nginx-proxy_default:`n    external: true`n