-cli", "ping"]`n      interval: 10s`n      timeout: 5s`n      retries: 5`n    networks:`n      - vninvest_network`n    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}`n    cpus: ${CORE_REDIS_CPUS:-0.5}`n`n  core-api:`n    build:`n      context: ./packages/core/backend`n      dockerfile: Dockerfile`n      args:`n        APP_RELEASE: ${APP_RELEASE:-main-local}`n      secrets:`n        - vnbroker_github_token`n    image: vninvest-core-api:${APP_RELEASE:-latest}`n    container_name: vninvest-core-api`n    restart: unless-stopped`n    environment:`n      CORE_ENV: production`n      CORE_API_PORT: "8100"`n      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}`n      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}`n      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}`n      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core`n      REDIS_URL: redis://core-redis:6379/3`n      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}`n      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}`n      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}`n      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}`n      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}`n    command: ["api"]`n    depends_on:`n      core-db:`n        condition: service_healthy`n      core-redis:`n        condition: service_healthy`n    healthcheck:`n      test:`n        [`n          "CMD",`n          "curl",`n          "--fail",`n          "--silent",`n          "http://127.0.0.1:8100/core/v1/health",`n        ]`n      interval: 10s`n      timeout: 5s`n      retries: 12`n      start_period: 30s`n    expose:`n      - "8100"`n    networks:`n      - vninvest_network`n    mem_limit: ${CORE_API_MEM_LIMIT:-256m}`n    cpus: ${CORE_API_CPUS:-0.5}`n`n  core-worker:`n    build:`n      context: ./packages/core/backend`n      dockerfile: Dockerfile`n      args:`n        APP_RELEASE: ${APP_RELEASE:-main-local}`n      secrets:`n        - vnbroker_github_token`n    image: vninvest-core-api:${APP_RELEASE:-latest}`n    container_name: vninvest-core-worker`n    restart: unless-stopped`n    environment:`n      CORE_ENV: production`n      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}`n      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}`n      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core`n      REDIS_URL: redis://core-redis:6379/3`n      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}`n      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}`n      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}`n      CELERY_QUEUES: ${CELERY_QUEUES_BACKFILL:-celery,enrichment_offhours,manual_on_demand,analytics_heavy}`n      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}`n      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}`n    command: ["worker"]`n    depends_on:`n      core-api:`n        condition: service_healthy`n    networks:`n      - vninvest_network`n    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}`n    cpus: ${CORE_WORKER_CPUS:-0.25}`n`n  queue-drain-monitor:`n    image: redis:7-alpine`n    container_name: vninvest-queue-drain-monitor`n    restart: on-failure:5`n    depends_on:`n      core-redis:`n        condition: service_healthy`n    entrypoint: ["/bin/sh", "-c"]`n    command:`n      - |`n        while true; do`n          TS=$$(date -u +"%Y-%m-%dT%H:%M:%SZ")`n          DEPTH=$$(redis-cli -h core-redis -n 3 LLEN realtime_prefetch 2>/dev/null || echo -1)`n          THRESHOLD=$${QUEUE_MONITOR_REALTIME_THRESHOLD:-500}`n          echo "[$$TS] realtime_prefetch_depth=$$DEPTH threshold=$$THRESHOLD"`n          if [ "$$DEPTH" -g