# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Hoặc trên Portainer: thêm cả 2 file hoặc dùng file này thay vì docker-compose.yml
services:
  db:
    image: postgres:15-alpine
    container_name: vninvest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vninvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-1.5}

  redis:
    image: redis:7-alpine
    container_name: vninvest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    cpus: ${REDIS_CPUS:-1.0}

  mailpit:
    image: axllent/mailpit:latest
    container_name: vninvest-mailpit
    restart: unless-stopped
    # Khong expose Mailpit tren production.
    ports: []
    networks:
      - vninvest_network

  core-db:
    image: postgres:16-alpine
    container_name: vninvest-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: vninvest
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vninvest -d vninvest_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_DB_MEM_LIMIT:-1g}
    cpus: ${CORE_DB_CPUS:-1.0}

  core-redis:
    image: redis:7-alpine
    container_name: vninvest-core-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}
    cpus: ${CORE_REDIS_CPUS:-0.5}

  core-api:
    image: python:3.13-slim
    container_name: vninvest-core-api
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: production
      CORE_API_PORT: "8100"
      POSTGRES_HOST: core-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: vninvest
      REDIS_URL: redis://core-redis:6379/0
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.api_stub"]
    depends_on:
      core-db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8100/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-256m}
    cpus: ${CORE_API_CPUS:-0.5}

  core-worker:
    image: python:3.13-slim
    container_name: vninvest-core-worker
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: production
      CORE_STUB_INTERVAL_SECONDS: "30"
      CORE_STUB_HEALTH_FILE: /tmp/vninvest-core-worker-health.json
      CORE_STUB_HEALTH_MAX_AGE_SECONDS: "90"
      POSTGRES_HOST: core-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: vninvest
      REDIS_URL: redis://core-redis:6379/0
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.worker_stub"]
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from vninvest_core.stub_heartbeat import run_healthcheck; run_healthcheck('/tmp/vninvest-core-worker-health.json')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-beat:
    image: python:3.13-slim
    container_name: vninvest-core-beat
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./packages/core/backend:/workspace
    environment:
      CORE_ENV: production
      CORE_STUB_INTERVAL_SECONDS: "30"
      CORE_STUB_HEALTH_FILE: /tmp/vninvest-core-beat-health.json
      CORE_STUB_HEALTH_MAX_AGE_SECONDS: "90"
      POSTGRES_HOST: core-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: vninvest
      REDIS_URL: redis://core-redis:6379/0
      PYTHONPATH: /workspace/src
    command: ["python", "-m", "vninvest_core.beat_stub"]
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from vninvest_core.stub_heartbeat import run_healthcheck; run_healthcheck('/tmp/vninvest-core-beat-health.json')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["/bin/sh", "/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    expose:
      - "8000"
    networks:
      - vninvest_network
    mem_limit: ${BACKEND_MEM_LIMIT:-1500m}
    cpus: ${BACKEND_CPUS:-1.5}

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q 'OK'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-2g}
    cpus: ${CELERY_WORKER_CPUS:-2.0}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; cmd = pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'celery' in cmd and 'beat' in cmd else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-750m}
    cpus: ${CELERY_BEAT_CPUS:-0.75}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev-package-shell
      args:
        REACT_APP_API_BASE_URL: /api
        APP_RELEASE: ${APP_RELEASE:-main-local}
        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
    container_name: vninvest-frontend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_RELEASE: ${APP_RELEASE:-main-local}
      REACT_APP_API_BASE_URL: /api
      REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
      REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
    depends_on:
      backend:
        condition: service_healthy
      core-api:
        condition: service_healthy
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    networks:
      - vninvest_network
    ports:
      - "${FRONTEND_PORT:-80}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-750m}
    cpus: ${FRONTEND_CPUS:-0.75}

volumes:
  postgres_data:
  core_pgdata:
  redis_data:

networks:
  vninvest_network:
    driver: bridge
