# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Hoặc trên Portainer: thêm cả 2 file hoặc dùng file này thay vì docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    container_name: vninvest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vninvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-1.5}

  redis:
    image: redis:7-alpine
    container_name: vninvest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    cpus: ${REDIS_CPUS:-1.0}

  mailpit:
    image: axllent/mailpit:latest
    container_name: vninvest-mailpit
    restart: unless-stopped
    # Khong expose Mailpit tren production.
    ports: []
    networks:
      - vninvest_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["/bin/sh", "/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    expose:
      - "8000"
    networks:
      - vninvest_network
    mem_limit: ${BACKEND_MEM_LIMIT:-1500m}
    cpus: ${BACKEND_CPUS:-1.5}

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q 'OK'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-2g}
    cpus: ${CELERY_WORKER_CPUS:-2.0}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; cmd = pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'celery' in cmd and 'beat' in cmd else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-750m}
    cpus: ${CELERY_BEAT_CPUS:-0.75}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - vninvest_network
    mem_limit: ${FRONTEND_MEM_LIMIT:-750m}
    cpus: ${FRONTEND_CPUS:-0.75}

volumes:
  postgres_data:
  redis_data:

networks:
  vninvest_network:
    driver: bridge
