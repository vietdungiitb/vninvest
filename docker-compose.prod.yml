# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Hoặc trên Portainer: thêm cả 2 file hoặc dùng file này thay vì docker-compose.yml
services:
  db:
    image: postgres:15-alpine
    container_name: vninvest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vninvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-1.5}

  mailpit:
    image: axllent/mailpit:latest
    container_name: vninvest-mailpit
    restart: unless-stopped
    # Khong expose Mailpit tren production.
    ports: []
    networks:
      - vninvest_network

  core-db:
    image: postgres:16-alpine
    container_name: vninvest-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set for core-db}
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vninvest -d vninvest_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_DB_MEM_LIMIT:-1g}
    cpus: ${CORE_DB_CPUS:-1.0}

  core-redis:
    image: redis:7-alpine
    container_name: vninvest-core-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - core_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}
    cpus: ${CORE_REDIS_CPUS:-0.5}

  core-api:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-api
    restart: unless-stopped
    environment:
      CORE_ENV: production
      CORE_API_PORT: "8100"
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    command: ["api"]
    depends_on:
      core-db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8100/core/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-256m}
    cpus: ${CORE_API_CPUS:-0.5}

  core-worker:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: ${CELERY_QUEUES_BACKFILL:-celery,enrichment_offhours,manual_on_demand,analytics_heavy}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  queue-drain-monitor:
    image: redis:7-alpine
    container_name: vninvest-queue-drain-monitor
    restart: on-failure:5
    depends_on:
      core-redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          TS=$$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPTH=$$(redis-cli -h core-redis -n 3 LLEN realtime_prefetch 2>/dev/null || echo -1)
          THRESHOLD=$${QUEUE_MONITOR_REALTIME_THRESHOLD:-500}
          echo "[$$TS] realtime_prefetch_depth=$$DEPTH threshold=$$THRESHOLD"
          if [ "$$DEPTH" -ge "$$THRESHOLD" ]; then
            echo "[$$TS] ALERT realtime_prefetch backlog high depth=$$DEPTH threshold=$$THRESHOLD"
          fi
          sleep $${QUEUE_MONITOR_INTERVAL_SECONDS:-300}
        done
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h core-redis -n 3 PING | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${QUEUE_MONITOR_MEM_LIMIT:-64m}
    cpus: ${QUEUE_MONITOR_CPUS:-0.10}

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: vninvest-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://core-redis:6379
      REDIS_EXPORTER_CHECK_KEYS: realtime_prefetch,manual_on_demand,analytics_heavy,enrichment_offhours
    depends_on:
      core-redis:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${REDIS_EXPORTER_CPUS:-0.10}

  core-worker-realtime-prefetch:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-realtime-prefetch
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: realtime_prefetch
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CELERY_CONCURRENCY: "4"
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-worker-realtime-stream:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-realtime-stream
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: realtime_stream
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CELERY_CONCURRENCY: "4"
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-worker-enrichment:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-enrichment
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: enrichment_offhours
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CELERY_CONCURRENCY: "6"
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-worker-analytics:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-analytics
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: analytics_heavy
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CELERY_CONCURRENCY: "4"
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-worker-manual:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-manual
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_QUEUES: manual_on_demand
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CELERY_CONCURRENCY: "3"
      MAIL_CREDENTIAL_FERNET_KEY: ${MAIL_CREDENTIAL_FERNET_KEY:?MAIL_CREDENTIAL_FERNET_KEY must be set}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-128m}
    cpus: ${CORE_WORKER_CPUS:-0.25}

  core-beat:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
      secrets:
        - vnbroker_github_token
    image: vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-beat
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
    command: ["beat"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
        VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to build private vnbroker dependency}
    container_name: vninvest-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://core-redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://core-redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://core-redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://core-redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://core-redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
      # PAT-only: pepper must match core-api for LegacyCorePATAuthentication to validate tokens.
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set in production}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["/bin/sh", "/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    expose:
      - "8000"
    networks:
      - vninvest_network
    mem_limit: ${BACKEND_MEM_LIMIT:-1500m}
    cpus: ${BACKEND_CPUS:-1.5}

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://core-redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://core-redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://core-redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://core-redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://core-redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q 'OK'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-2g}
    cpus: ${CELERY_WORKER_CPUS:-2.0}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-main-local}
    container_name: vninvest-celery-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
      - ./backend/.env:/app/.env:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://core-redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://core-redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://core-redis:6379/2}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://core-redis:6379/0}
      STREAM_REDIS_URL: ${STREAM_REDIS_URL:-redis://core-redis:6379/1}
      APP_RELEASE: ${APP_RELEASE:-main-local}
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    depends_on:
      db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; cmd = pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'celery' in cmd and 'beat' in cmd else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vninvest_network
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-750m}
    cpus: ${CELERY_BEAT_CPUS:-0.75}

  # SM-P5.1: PgBouncer connection pooling
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: vninvest-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-vninvest}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "500"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6432"
    networks:
      - vninvest_network
    mem_limit: ${PGBOUNCER_MEM_LIMIT:-64m}
    cpus: ${PGBOUNCER_CPUS:-0.25}

  # SM-P5.2: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vninvest-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - vninvest_network
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPUS:-0.5}

  # SM-P5.2: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: vninvest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    expose:
      - "3000"
    networks:
      - vninvest_network
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.25}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev-package-shell
      secrets:
        - vnbroker_github_token
      args:
        REACT_APP_API_BASE_URL: /api
        APP_RELEASE: ${APP_RELEASE:-main-local}
        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
    container_name: vninvest-frontend
    restart: unless-stopped
    environment:
      APP_RELEASE: ${APP_RELEASE:-main-local}
      REACT_APP_API_BASE_URL: /api
      REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
      REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
      VIRTUAL_HOST: ${DOMAIN:-vninvest.edusuccess.vn}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN:-vninvest.edusuccess.vn}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@edusuccess.vn}
    depends_on:
      backend:
        condition: service_healthy
      core-api:
        condition: service_healthy
    labels:
      com.vninvest.release: ${APP_RELEASE:-main-local}
    expose:
      - "80"
    networks:
      - vninvest_network
      - nginx-proxy_default
    mem_limit: ${FRONTEND_MEM_LIMIT:-750m}
    cpus: ${FRONTEND_CPUS:-0.75}

volumes:
  postgres_data:
  core_pgdata:
  core_redis_data:
  prometheus_data:
  grafana_data:

secrets:
  vnbroker_github_token:
    environment: VNBROKER_GITHUB_TOKEN

networks:
  vninvest_network:
    driver: bridge
  nginx-proxy_default:
    external: true
