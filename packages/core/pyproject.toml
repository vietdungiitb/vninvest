[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vninvest-core"
version = "1.1.0"
description = "VNInvest core package-track foundation baseline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # Phai khop `packages/core/backend/requirements.txt` va container that.
  # Docker dat cai tu requirements.txt nen day la rang buoc THAT su chay
  # (do 2026-10-03: container `vninvest-dev-core-api` = Django 5.2.17).
  # Truoc day khai `<5.0` trong khi requirements.txt va runtime deu la 5.2.x
  # ⇒ `pip install vninvest-core` len sai major.
  "Django>=5.2,<6.0",
  "djangorestframework>=3.15,<4.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "psycopg[binary]>=3.2,<3.3",
  "pandas>=2.2,<3.0",
]

[project.scripts]
vninvest-core-api = "vninvest_core.api_stub:main"
vninvest-core-worker = "vninvest_core.worker_stub:main"
vninvest-core-beat = "vninvest_core.beat_stub:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]