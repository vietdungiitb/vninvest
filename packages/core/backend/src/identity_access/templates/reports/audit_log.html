<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Audit Log</title></head>
<body style="font-family:sans-serif;padding:20px;">
<h2>Audit Log — {{ tenant.display_name }}</h2>
<p>Date: {{ date }}</p>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
<tr style="background:#f0f0f0;"><th>Member</th><th>Role</th><th>Joined</th></tr>
{% for m in members %}
<tr>
<td>{{ m.user.email }}</td><td>{{ m.role }}</td><td>{{ m.joined_at|date:"Y-m-d" }}</td>
</tr>
{% empty %}
<tr><td colspan="3">No members found.</td></tr>
{% endfor %}
</table>
</body>
</html>
