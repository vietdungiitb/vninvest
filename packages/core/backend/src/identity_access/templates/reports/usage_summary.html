<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Usage Summary</title></head>
<body style="font-family:sans-serif;padding:20px;">
<h2>Usage Summary — {{ tenant.display_name }}</h2>
<p>Date: {{ date }}</p>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
<tr style="background:#f0f0f0;"><th>Meter</th><th>Consumed</th><th>Entitled</th><th>Remaining</th><th>Risk</th></tr>
{% for q in quotas %}
<tr>
<td>{{ q.meter_name }}</td><td>{{ q.consumed_amount }}</td><td>{{ q.entitled_amount }}</td>
<td>{{ q.remaining_amount }}</td><td>{{ q.risk_state }}</td>
</tr>
{% empty %}
<tr><td colspan="5">No data available.</td></tr>
{% endfor %}
</table>
</body>
</html>
