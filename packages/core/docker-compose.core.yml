name: vninvest-core-package

services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: vninvest
    ports:
      - "5434:5432"
    volumes:
      - core_pgdata:/var/lib/postgresql/data

  core-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"

  core-api:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: "dev-pat-pepper-replace-in-production"
      PYTHONPATH: /workspace/src
    command: >-
      sh -c "pip install -r requirements.txt -q && python manage.py migrate --noinput && python -m daphne --bind 0.0.0.0 --port 8100 vninvest_core.asgi:application"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started
    ports:
      - "8100:8100"

  core-worker:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: celery,realtime_prefetch,realtime_stream,analytics_heavy,manual_on_demand
      CELERY_CONCURRENCY: "2"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=2"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-worker-realtime-prefetch:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: realtime_prefetch
      CELERY_CONCURRENCY: "4"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=4 --queues=realtime_prefetch"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-worker-realtime-stream:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: realtime_stream
      CELERY_CONCURRENCY: "4"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=4 --queues=realtime_stream"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-worker-enrichment:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: enrichment_offhours
      CELERY_CONCURRENCY: "6"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=6 --queues=enrichment_offhours"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-worker-analytics:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: analytics_heavy
      CELERY_CONCURRENCY: "4"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=4 --queues=analytics_heavy"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-worker-manual:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
      CELERY_QUEUES: manual_on_demand
      CELERY_CONCURRENCY: "3"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core worker --loglevel=info --concurrency=3 --queues=manual_on_demand"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

  core-beat:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      CORE_ENV: development
      DJANGO_SETTINGS_MODULE: vninvest_core.settings
      VNBROKER_GITHUB_TOKEN: ${VNBROKER_GITHUB_TOKEN:?VNBROKER_GITHUB_TOKEN must be set to install private vnbroker dependency}
      CORE_DATABASE_URL: postgres://vninvest:vninvest@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CELERY_BROKER_URL: redis://core-redis:6379/3
      PYTHONPATH: /workspace/src
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python -m celery -A vninvest_core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      core-db:
        condition: service_started
      core-redis:
        condition: service_started

volumes:
  core_pgdata:
