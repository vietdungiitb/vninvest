name: vninvest-core-package

services:
	core-db:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: vninvest_core
			POSTGRES_USER: vninvest
			POSTGRES_PASSWORD: vninvest
		ports:
			- "5434:5432"
		volumes:
			- core_pgdata:/var/lib/postgresql/data

	core-redis:
		image: redis:7-alpine
		command: ["redis-server", "--save", "", "--appendonly", "no"]
		ports:
			- "6381:6379"

	core-api:
		image: python:3.13-slim
		working_dir: /workspace
		volumes:
			- ./backend:/workspace
		environment:
			CORE_ENV: foundation
			CORE_API_PORT: "8100"
			POSTGRES_HOST: core-db
			POSTGRES_PORT: "5432"
			POSTGRES_DB: vninvest_core
			POSTGRES_USER: vninvest
			POSTGRES_PASSWORD: vninvest
			REDIS_URL: redis://core-redis:6379/0
			PYTHONPATH: /workspace/src
		command: ["python", "-m", "vninvest_core.api_stub"]
		depends_on:
			core-db:
				condition: service_started
			core-redis:
				condition: service_started
		ports:
			- "8100:8100"

	core-worker:
		image: python:3.13-slim
		working_dir: /workspace
		volumes:
			- ./backend:/workspace
		environment:
			CORE_ENV: foundation
			CORE_STUB_INTERVAL_SECONDS: "30"
			POSTGRES_HOST: core-db
			POSTGRES_PORT: "5432"
			POSTGRES_DB: vninvest_core
			POSTGRES_USER: vninvest
			POSTGRES_PASSWORD: vninvest
			REDIS_URL: redis://core-redis:6379/0
			PYTHONPATH: /workspace/src
		command: ["python", "-m", "vninvest_core.worker_stub"]
		depends_on:
			core-db:
				condition: service_started
			core-redis:
				condition: service_started

	core-beat:
		image: python:3.13-slim
		working_dir: /workspace
		volumes:
			- ./backend:/workspace
		environment:
			CORE_ENV: foundation
			CORE_STUB_INTERVAL_SECONDS: "30"
			POSTGRES_HOST: core-db
			POSTGRES_PORT: "5432"
			POSTGRES_DB: vninvest_core
			POSTGRES_USER: vninvest
			POSTGRES_PASSWORD: vninvest
			REDIS_URL: redis://core-redis:6379/0
			PYTHONPATH: /workspace/src
		command: ["python", "-m", "vninvest_core.beat_stub"]
		depends_on:
			core-db:
				condition: service_started
			core-redis:
				condition: service_started

volumes:
	core_pgdata:
