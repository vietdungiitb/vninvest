<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị nội dung — VNInvest</title>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'vietdungiitb/vninvest',
            branch: 'dev',
            base_url: window.location.origin,
            auth_endpoint: 'api/cms-auth',
          },
          media_folder: 'packages/opencore-site/public/images/blog',
          public_folder: '/images/blog',
          locale: 'vi',
          collections: [
            {
              name: 'blog',
              label: 'Bài viết',
              label_singular: 'Bài viết',
              folder: 'packages/opencore-site/src/content/blog',
              create: true,
              delete: true,
              slug: '{{slug}}',
              extension: 'mdx',
              format: 'frontmatter',
              summary: '{{title}} — {{date}}',
              fields: [
                {
                  label: 'Tiêu đề',
                  name: 'title',
                  widget: 'string',
                  hint: 'Tiêu đề bài viết hiển thị trên trang và thẻ meta',
                },
                {
                  label: 'Tóm tắt',
                  name: 'summary',
                  widget: 'text',
                  hint: 'Đoạn mô tả ngắn, dùng cho listing và meta description',
                },
                {
                  label: 'Ngày đăng',
                  name: 'date',
                  widget: 'datetime',
                  format: 'YYYY-MM-DD',
                  date_format: 'DD/MM/YYYY',
                  time_format: false,
                  default: new Date().toISOString().slice(0, 10),
                },
                {
                  label: 'Thời gian đọc',
                  name: 'readingTime',
                  widget: 'string',
                  default: '5 phút',
                  hint: 'Ví dụ: 4 phút, 8 phút đọc',
                },
                {
                  label: 'Nội dung',
                  name: 'body',
                  widget: 'markdown',
                },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
