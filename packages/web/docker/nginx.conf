# cache-bust: 2026-06-21
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=50r/s;

# --- Client IP trust (realip module) ---------------------------------------
# Why: without these, $remote_addr is the address of whoever is directly
# connected and X-Forwarded-For arrives verbatim from the client, so any client
# can choose the IP that the backend records and rate-limits against
# (`proxy_add_x_forwarded_for` APPENDS to the attacker-supplied header, and the
# backend used to read its left-most entry).
# set_real_ip_from restricts the rewrite to peers we actually run behind.
# real_ip_recursive on then walks the whole X-Forwarded-For chain and picks the
# last non-trusted address, so the header we forward is already normalised.
# Result: $remote_addr (and therefore X-Real-IP below) is the real client, and
# vninvest_core.client_ip.get_client_ip() can trust REMOTE_ADDR.
# NOTE: this file is copied to /etc/nginx/conf.d/default.conf, so its top level
# IS the http{} context of the main nginx.conf - do NOT wrap it in http{}.
# Keep in sync with TRUSTED_PROXY_IPS in
# packages/core/backend/src/vninvest_core/settings.py.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Real-IP;
real_ip_recursive on;

map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" https;
}

map $http_x_forwarded_port $proxy_forwarded_port {
    default $http_x_forwarded_port;
    "" 443;
}

map $host $backend_host {
    default $host;
    beta.edusuccess.vn saas.edusuccess.vn;
}

server {
    listen 80;
    server_name _;
    sendfile off;

    # Limit requests return HTTP 429
    limit_req_status 429;

    # SaaS production: core-api is the single backend. No legacy backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api_upstream core-api:8100;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # React SPA operator panel: /admin/core/* — must come BEFORE the generic /admin/ block.
    location ^~ /admin/core/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # React SPA staff fleet: /admin/<fleet>/* — must come BEFORE the generic /admin/ block.
    # (Same reason as /admin/core/ above: `location ^~ /admin/` would proxy these SPA
    # routes to Django, which 404s via admin catch_all_view. Nginx ^~ prefix match:
    # longest prefix wins, so these entries take precedence over the generic block.
    # A regex location would NOT work here (^~ suppresses regex evaluation.)
    # Keep in sync with group "admin" in src/app/routeCatalog.js — enforced by
    # scripts/check-admin-spa-routes.mjs (npm run check:admin-spa-routes).
    # NOTE: /admin/audit also covers /admin/audit-trace by prefix; listed explicitly anyway.
    location ^~ /admin/users {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/tenants {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/billing {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/usage {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/audit {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/audit-trace {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/analytics {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/overview {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/jobs {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # ⚠ ĐÂY LÀ BLOCK DUY NHẤT DÙNG `location =` (không phải `^~`).
    #
    # LÝ DO (đo 2026-10-10, `docs/PLAN_DJANGO_ADMIN_UIUX_20261010.md` O1):
    # `/admin/advertising` là **app_label của Django** (`advertising` có `admin.py`
    # với 4 ModelAdmin). Block `location ^~ /admin/advertising` là **prefix** ⇒
    # khớp CẢ `/admin/advertising/adcampaign/`, `/admin/advertising/adcampaign/1/change/`
    # … ⇒ **toàn bộ admin của app `advertising` bị nuốt**, trả về `index.html` của SPA
    # thay vì trang admin.
    #
    # `location =` là **exact match** ⇒ chỉ khớp đúng `/admin/advertising`.
    # Thứ tự ưu tiên của nginx: `=` > `^~` > regex > prefix. Nên:
    #   /admin/advertising              -> SPA      (đây)
    #   /admin/advertising/             -> Django   (app_index của app `advertising`)
    #   /admin/advertising/adcampaign/  -> Django   (changelist)
    # Không cần đổi route của SPA ⇒ không đụng `routeCatalog.js` / `sidebaritems.ts`.
    #
    # Đây là block DUY NHẤT được phép dùng `=`. Mọi `/admin/<fleet>` khác giữ `^~`
    # vì không trùng `app_label` nào của Django — kiểm bằng gate hai chiều
    # `npm run check:admin-spa-routes` (block `admin-ux` trong `pre-push-gate.mjs`).
    location = /admin/advertising {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Django admin — served by core-api (SaaS backend).
    location ^~ /admin/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # Django static files (admin, swagger, etc.) — served by core-api.
    location ^~ /static/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # React SPA — all unmatched paths.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # All /api/* traffic — core-api is sole entry point (native + compat routes).
    location = /api/health {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    location = /api/health/ {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    location ^~ /api/public/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/soc/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/v1/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/admin-ops/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        rewrite ^/api/core/v1/(.*) /core/v1/$1 break;
        rewrite ^/api/(.*) /core/v1/$1 break;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    # /core/v1/* — native core-api endpoints.
    location ^~ /core/v1/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # WebSocket — core-api ASGI (Django Channels, B7 complete).
    location /ws/ {
        proxy_pass http://$core_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_read_timeout 86400s;
    }
}
