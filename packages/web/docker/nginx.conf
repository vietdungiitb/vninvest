# cache-bust: 2026-06-21
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=50r/s;

map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" https;
}

map $http_x_forwarded_port $proxy_forwarded_port {
    default $http_x_forwarded_port;
    "" 443;
}

map $host $backend_host {
    default $host;
    beta.edusuccess.vn saas.edusuccess.vn;
}

server {
    listen 80;
    server_name _;
    sendfile off;

    # Limit requests return HTTP 429
    limit_req_status 429;

    # SaaS production: core-api is the single backend. No legacy backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api_upstream core-api:8100;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # React SPA operator panel: /admin/core/* — must come BEFORE the generic /admin/ block.
    location ^~ /admin/core/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # React SPA staff fleet: /admin/<fleet>/* — must come BEFORE the generic /admin/ block.
    # (Same reason as /admin/core/ above: `location ^~ /admin/` would proxy these SPA
    # routes to Django, which 404s via admin catch_all_view. Nginx ^~ prefix match:
    # longest prefix wins, so these entries take precedence over the generic block.
    # A regex location would NOT work here (^~ suppresses regex evaluation.)
    # Keep in sync with group "admin" in src/app/routeCatalog.js — enforced by
    # scripts/check-admin-spa-routes.mjs (npm run check:admin-spa-routes).
    # NOTE: /admin/audit also covers /admin/audit-trace by prefix; listed explicitly anyway.
    location ^~ /admin/users {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/tenants {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/billing {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/usage {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/audit {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/audit-trace {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/analytics {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/overview {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/jobs {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin/advertising {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Django admin — served by core-api (SaaS backend).
    location ^~ /admin/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # Django static files (admin, swagger, etc.) — served by core-api.
    location ^~ /static/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # React SPA — all unmatched paths.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # All /api/* traffic — core-api is sole entry point (native + compat routes).
    location = /api/health {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    location = /api/health/ {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    location ^~ /api/public/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/soc/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/v1/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location ^~ /api/admin-ops/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        rewrite ^/api/core/v1/(.*) /core/v1/$1 break;
        rewrite ^/api/(.*) /core/v1/$1 break;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 300s;
    }

    # /core/v1/* — native core-api endpoints.
    location ^~ /core/v1/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $backend_host;
        proxy_read_timeout 120s;
    }

    # WebSocket — core-api ASGI (Django Channels, B7 complete).
    location /ws/ {
        proxy_pass http://$core_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_read_timeout 86400s;
    }
}
