name: vninvest-opencore-package

services:
  opencore-web:
    image: nginx:1.27-alpine
    container_name: vninvest-opencore-web
    ports:
      - "${OPENCORE_HTTP_PORT:-8088}:80"
    environment:
      OPENCORE_CHANNEL: community
    volumes:
      - "${OPENCORE_WEB_DIST_DIR:-../web/dist/community}:/usr/share/nginx/html:ro"
      - "../opencore/distribution/nginx-opencore.conf:/etc/nginx/conf.d/default.conf:ro"
    restart: unless-stopped
