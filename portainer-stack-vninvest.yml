# portainer-stack-vninvest.yml
# ─────────────────────────────────────────────────────────────────────────────
# Portainer stack — VNInvest production deployment using GHCR images.
#
# Setup steps:
#   1. Portainer → Settings → Registries → Add registry
#      Type: Custom | URL: ghcr.io | User: vietdungiitb | Password: <GitHub PAT read:packages>
#   2. Portainer → Stacks → Add Stack → Web editor → paste this file
#   3. Fill in all environment variables in the "Environment variables" section
#   4. Deploy the stack
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  db:
    image: postgres:15-alpine
    container_name: vninvest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vninvest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-1.5}

  redis:
    image: redis:7-alpine
    container_name: vninvest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    cpus: ${REDIS_CPUS:-1.0}

  core-db:
    image: postgres:16-alpine
    container_name: vninvest-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vninvest -d vninvest_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_DB_MEM_LIMIT:-1g}
    cpus: ${CORE_DB_CPUS:-1.0}

  core-redis:
    image: redis:7-alpine
    container_name: vninvest-core-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}
    cpus: ${CORE_REDIS_CPUS:-0.5}

  # ── Core API (SaaS) ──────────────────────────────────────────────────────────

  core-api:
    image: ghcr.io/vietdungiitb/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-api
    restart: unless-stopped
    environment:
      CORE_ENV: production
      CORE_API_PORT: "8100"
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/0
    command: ["api"]
    depends_on:
      core-db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8100/health/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    expose:
      - "8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-512m}
    cpus: ${CORE_API_CPUS:-0.75}

  core-worker:
    image: ghcr.io/vietdungiitb/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/0
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-256m}
    cpus: ${CORE_WORKER_CPUS:-0.5}

  core-beat:
    image: ghcr.io/vietdungiitb/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-beat
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/0
    command: ["beat"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  # ── Legacy Backend ───────────────────────────────────────────────────────────

  backend:
    image: ghcr.io/vietdungiitb/vninvest-backend:${APP_RELEASE:-latest}
    container_name: vninvest-backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      REALTIME_REDIS_URL: redis://redis:6379/0
      STREAM_REDIS_URL: redis://redis:6379/1
      REALTIME_ENABLED: "True"
      WATCHLIST_SYNC_ENABLED: "True"
      WATCHLIST_SYNC_MINUTES: "15"
      WATCHLIST_SYNC_DAYS: "5"
      ADVISORY_AUTO_GENERATION_ENABLED: "True"
      ADVISORY_AUTO_GENERATION_INTERVAL_MINUTES: "240"
      ADVISORY_AUTO_GENERATION_BATCH_SIZE: "200"
      OPEN_CORE_QUOTA_ENFORCEMENT_ENABLED: "True"
      REVERSAL_DETECTION_ENABLED: "True"
      APP_RELEASE: ${APP_RELEASE:-latest}
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    expose:
      - "8000"
    networks:
      - vninvest_network
    mem_limit: ${BACKEND_MEM_LIMIT:-1500m}
    cpus: ${BACKEND_CPUS:-1.5}

  celery-worker:
    image: ghcr.io/vietdungiitb/vninvest-backend:${APP_RELEASE:-latest}
    container_name: vninvest-celery-worker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      REALTIME_REDIS_URL: redis://redis:6379/0
      STREAM_REDIS_URL: redis://redis:6379/1
      APP_RELEASE: ${APP_RELEASE:-latest}
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CELERY_WORKER_MEM_LIMIT:-2g}
    cpus: ${CELERY_WORKER_CPUS:-2.0}

  celery-beat:
    image: ghcr.io/vietdungiitb/vninvest-backend:${APP_RELEASE:-latest}
    container_name: vninvest-celery-beat
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vninvest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      REALTIME_REDIS_URL: redis://redis:6379/0
      STREAM_REDIS_URL: redis://redis:6379/1
      APP_RELEASE: ${APP_RELEASE:-latest}
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-750m}
    cpus: ${CELERY_BEAT_CPUS:-0.75}

  # ── Frontend — nginx-proxy SSL termination ───────────────────────────────────

  frontend:
    image: ghcr.io/vietdungiitb/vninvest-frontend:${APP_RELEASE:-latest}
    container_name: vninvest-frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      backend:
        condition: service_healthy
      core-api:
        condition: service_started
    networks:
      - vninvest_network
      - nginx-proxy_default
    mem_limit: ${FRONTEND_MEM_LIMIT:-750m}
    cpus: ${FRONTEND_CPUS:-0.75}

volumes:
  postgres_data:
  core_pgdata:
  redis_data:

networks:
  vninvest_network:
    driver: bridge
  nginx-proxy_default:
    external: true
