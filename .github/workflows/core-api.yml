name: Core API — CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/core/backend/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/backend/**"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vninvest_core_test
          POSTGRES_USER: vninvest
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vninvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: packages/core/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/core/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-django

      - name: Run tests
        env:
          CORE_DATABASE_URL: postgresql://vninvest:testpassword@localhost:5432/vninvest_core_test
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: test-secret-key-ci-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DJANGO_DEBUG: "true"
        run: python src/manage.py test --keepdb --failfast

  build:
    name: Build Docker image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: packages/core/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vninvest-core-api:latest
            ghcr.io/${{ github.repository_owner }}/vninvest-core-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_RELEASE=${{ github.sha }}
