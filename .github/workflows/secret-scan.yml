# Secret scan — chặn secret quay lại repo
#
# VÌ SAO FILE NÀY TỒN TẠI KHI CI ĐANG TẮT
# ------------------------------------------
# `.github/workflows-disabled/README.md`: GitHub Actions của repo đã TẮT từ
# 2026-09-27 vì billing — 200/200 run gần nhất thất bại, không có run xanh nào.
# Nghĩa là workflow này **chưa chạy** cho tới khi owner trả billing và
# `git mv .github/workflows-disabled/*.yml .github/workflows/`.
#
# Trong lúc đó, gate thật đang chạy ở LOCAL:
#   node scripts/pre-push-gate.mjs   (đã nối scan-secrets)
#   node packages/web/scripts/scan-secrets.mjs   (chạy tay)
#
# Khi bật lại CI, giữ nguyên file này. Bắt buộc:
#   - KHÔNG `continue-on-error: true`
#   - KHÔNG `|| true` quanh bước scan
#   - KHÔNG pipe output của scanner (exit code lấy của lệnh cuối)
#
# Owner cần đặt secret sau khi bật:
#   BROKER_SECRET_KEY, CORE_PAT_PEPPER, DNSE_CREDENTIAL_FERNET_KEY, ...
# (xem compose.dev.env.example)

name: secret-scan

on:
  pull_request:
  push:
    branches: [dev, main]

# Không cho workflow tự hủy — fail là fail.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0: scanner chỉ quét tracked file ở HEAD, nên không cần
          # history. Nếu sau này thêm quét lịch sử thì tăng depth lên đây.
          fetch-depth: 1

      - name: Bật Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Self-test scanner (chứng minh gate thật sự bắt được)
        run: node packages/web/scripts/scan-secrets.mjs --self-test

      - name: Quét secret trong tracked files
        # KHÔNG thêm `|| true` và KHÔNG pipe. Exit != 0 là fail.
        run: node packages/web/scripts/scan-secrets.mjs

      - name: Chặn hunk ghi vào file shared (deny list)
        run: node packages/web/scripts/check-multi-agent.mjs
