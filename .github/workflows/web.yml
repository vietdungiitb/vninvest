name: Frontend & packages/web — CI/CD

on:
  push:
    branches: [main, dev, enterprise]
    paths:
      - "frontend/**"
      - "packages/web/**"
  pull_request:
    branches: [main, enterprise]
    paths:
      - "frontend/**"
      - "packages/web/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push Docker image (only applies to enterprise/main)"
        required: false
        default: "true"

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages/web deps
        working-directory: packages/web
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_API_BASE_URL: /api
          REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
          REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/enterprise'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/build
          retention-days: 7

  build-docker:
    name: Build & push Docker image
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/enterprise'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vninvest-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/enterprise' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.dev-package-shell
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_BASE_URL=/api
            REACT_APP_ENABLE_PACKAGE_SHELL_HOST=1
            REACT_APP_PACKAGE_SHELL_CORE_BASE_URL=/core/v1
            APP_RELEASE=${{ github.sha }}
