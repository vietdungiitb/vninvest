# cache-bust: 2026-05-28
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" https;
}

map $http_x_forwarded_port $proxy_forwarded_port {
    default $http_x_forwarded_port;
    "" 443;
}

server {
    listen 80;
    server_name _;

    # Limit requests return HTTP 429
    limit_req_status 429;


    # SaaS production: core-api is the single backend. No legacy backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api_upstream core-api:8100;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # React SPA operator panel: /admin/core/* — must come BEFORE the generic /admin/ block.
    location ^~ /admin/core/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Django admin — served by core-api (SaaS backend).
    location ^~ /admin/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Django admin static files — served by core-api.
    location ^~ /static/admin/ {
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # React SPA — all unmatched paths.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # All /api/* traffic — core-api is sole entry point (native + compat routes).
    location = /api/health {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /api/health/ {
        proxy_pass http://$core_api_upstream/core/v1/health;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # /core/v1/* — native core-api endpoints.
    location ^~ /core/v1/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass http://$core_api_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # WebSocket — core-api ASGI (Django Channels, B7 complete).
    location /ws/ {
        proxy_pass http://$core_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_read_timeout 86400s;
    }
}
