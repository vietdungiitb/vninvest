map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" https;
}

map $http_x_forwarded_port $proxy_forwarded_port {
    default $http_x_forwarded_port;
    "" 443;
}

server {
    listen 80;
    server_name _;

    # Re-resolve backend service name via Docker DNS to avoid stale upstream IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;
    set $core_shell_upstream core-api:8100;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # React SPA operator panel: /admin/core/* — must come BEFORE the generic /admin/ block
    # so nginx matches this specific prefix instead of proxying to Django Admin.
    location ^~ /admin/core/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Route Django admin to backend instead of React router.
    location ^~ /admin/ {
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Serve Django admin static assets from backend staticfiles.
    location ^~ /static/admin/ {
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # SFI-B1.5: All /api/* traffic goes to core-api, which proxies unhandled paths to legacy.
    # PAT-only architecture: core-api is the single auth entry point; legacy backend is internal only.
    location /api/ {
        proxy_pass http://$core_shell_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # SFI-B7: Legacy realtime WebSocket — forward /ws/realtime/ to backend (Django Channels).
    location /ws/realtime/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_read_timeout 86400s;
    }

    # SFI-B7: New core-api WebSocket — forward /ws/market/* to core-api ASGI.
    # TODO(SFI-B1.7): Switch proxy_pass back to http://$core_shell_upstream once core-api is in the production stack.
    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_read_timeout 86400s;
    }

    # TODO(SFI-B1.7): Switch proxy_pass back to http://$core_shell_upstream once core-api is in the production stack.
    location ^~ /core/v1/ {
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
