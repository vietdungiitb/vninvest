# docker-compose.ghcr.yml
# ─────────────────────────────────────────────────────────────────────────────
# SaaS Production — pull pre-built images from GitHub Container Registry (GHCR).
# NO source code required on the server. Legacy backend removed.
#
# Deploy trên server (sau khi CI build xong image):
#   echo "GHCR_OWNER=vietdungiitb" >> .env.production
#   docker compose -f docker-compose.ghcr.yml --env-file .env.production pull
#   docker compose -f docker-compose.ghcr.yml --env-file .env.production up -d --no-build
#
# Rolling update:
#   docker compose -f docker-compose.ghcr.yml --env-file .env.production pull core-api frontend
#   docker compose -f docker-compose.ghcr.yml --env-file .env.production up -d --no-deps --no-build core-api frontend
#
# Required env vars (set trong .env.production trên server):
#   APP_RELEASE              — image tag: latest (enterprise) | dev-latest (dev) | <sha>
#   GHCR_OWNER               — GitHub username (vietdungiitb)
#   CORE_DB_PASSWORD         — PostgreSQL 16 password for core-api
#   CORE_DJANGO_SECRET_KEY   — Django secret key cho core-api
#   CORE_ALLOWED_HOSTS       — vninvest.edusuccess.vn,localhost
#   CORE_CORS_ALLOWED_ORIGINS — https://vninvest.edusuccess.vn
#   FRONTEND_URL             — https://vninvest.edusuccess.vn
#   CORE_PAT_PEPPER          — 32-char hex HMAC pepper
#   GRAFANA_ADMIN_PASSWORD   — Grafana admin password
#   DOMAIN                   — vninvest.edusuccess.vn
#   LETSENCRYPT_EMAIL        — email for Let's Encrypt
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Core Database (PostgreSQL 16) ────────────────────────────────────────────
  core-db:
    image: postgres:16-alpine
    container_name: vninvest-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vninvest -d vninvest_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_DB_MEM_LIMIT:-1g}
    cpus: ${CORE_DB_CPUS:-1.0}

  # ── Core Redis ───────────────────────────────────────────────────────────────
  core-redis:
    image: redis:7-alpine
    container_name: vninvest-core-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - core_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}
    cpus: ${CORE_REDIS_CPUS:-0.5}

  # ── Core API — pulled from GHCR ──────────────────────────────────────────────
  core-api:
    image: ghcr.io/${GHCR_OWNER:-vietdungiitb}/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-api
    restart: unless-stopped
    environment:
      CORE_ENV: production
      CORE_API_PORT: "8100"
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CORS_API_DYNAMIC_ALLOW: ${CORS_API_DYNAMIC_ALLOW:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      # D-15 / SEC-02: secret broker phai rieng `SECRET_KEY`. Thieu bien nay thi
      # `SecretStore` rot ve key v1 = derive tu `SECRET_KEY`, tuc muc tieu D-15 vo hieu.
      BROKER_SECRET_KEY: ${BROKER_SECRET_KEY:?BROKER_SECRET_KEY must be set}

    command: ["api"]
    depends_on:
      core-db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8100/core/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    expose:
      - "8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-512m}
    cpus: ${CORE_API_CPUS:-1.0}

  # ── Core Celery Worker ───────────────────────────────────────────────────────
  core-worker:
    image: ghcr.io/${GHCR_OWNER:-vietdungiitb}/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      # Slice E (QueueRecovery): kèm enrichment_eod (daily-backfill tách marathon).
      CELERY_QUEUES: ${CELERY_QUEUES_BACKFILL:-celery,enrichment_offhours,enrichment_eod,manual_on_demand,analytics_heavy}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-256m}
    cpus: ${CORE_WORKER_CPUS:-0.5}

  # ── Core Realtime Worker ───────────────────────────────────────────────────
  core-worker-realtime:
    image: ghcr.io/${GHCR_OWNER:-vietdungiitb}/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-worker-realtime
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY_REALTIME:-2}
      # Slice D (QueueRecovery): kèm realtime_scheduler (heartbeat 3s tách queue).
      CELERY_QUEUES: ${CELERY_QUEUES_REALTIME:-realtime_prefetch,realtime_scheduler,realtime_stream}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_REALTIME_MEM_LIMIT:-256m}
    cpus: ${CORE_WORKER_REALTIME_CPUS:-0.5}

  # ── Realtime Queue Drain Monitor ───────────────────────────────────────────
  queue-drain-monitor:
    image: redis:7-alpine
    container_name: vninvest-queue-drain-monitor
    restart: on-failure:5
    depends_on:
      core-redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          TS=$$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          THRESHOLD=$${QUEUE_MONITOR_REALTIME_THRESHOLD:-500}
          # Slice G (QueueRecovery, audit F5): theo dõi mọi queue (không chỉ realtime_prefetch).
          for Q in realtime_prefetch realtime_scheduler enrichment_offhours enrichment_eod manual_on_demand analytics_heavy celery screener; do
            DEPTH=$$(redis-cli -h core-redis -n 3 LLEN $$Q 2>/dev/null || echo -1)
            echo "[$$TS] queue_depth queue=$$Q depth=$$DEPTH threshold=$$THRESHOLD"
            if [ "$$DEPTH" -ge "$$THRESHOLD" ]; then
              echo "[$$TS] ALERT queue=$$Q backlog high depth=$$DEPTH threshold=$$THRESHOLD"
            fi
          done
          sleep $${QUEUE_MONITOR_INTERVAL_SECONDS:-300}
        done
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h core-redis -n 3 PING | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vninvest_network
    mem_limit: ${QUEUE_MONITOR_MEM_LIMIT:-64m}
    cpus: ${QUEUE_MONITOR_CPUS:-0.10}

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: vninvest-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://core-redis:6379
      REDIS_EXPORTER_CHECK_KEYS: realtime_prefetch,manual_on_demand,analytics_heavy,enrichment_offhours
    depends_on:
      core-redis:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${REDIS_EXPORTER_CPUS:-0.10}

  # ── Core Celery Beat ─────────────────────────────────────────────────────────
  core-beat:
    image: ghcr.io/${GHCR_OWNER:-vietdungiitb}/vninvest-core-api:${APP_RELEASE:-latest}
    container_name: vninvest-core-beat
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/3
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
    command: ["beat"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  # ── Frontend — pulled from GHCR ──────────────────────────────────────────────
  # ModernDashboard là default. packages/web shell active.
  frontend:
    image: ghcr.io/${GHCR_OWNER:-vietdungiitb}/vninvest-frontend:${APP_RELEASE:-latest}
    container_name: vninvest-frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${DOMAIN:-saas.edusuccess.vn}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN:-saas.edusuccess.vn}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@edusuccess.vn}
    depends_on:
      core-api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - vninvest_network
      - nginx-proxy_default
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.7.0@sha256:29c1e0b48ad816750245dea3d65ac3ce57dda30547e67b1e9a5176e2953cc4dc
    container_name: vninvest-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - vninvest_network
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPUS:-0.5}

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: vninvest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://saas.edusuccess.vn/grafana}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    expose:
      - "3000"
    networks:
      - vninvest_network
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.25}

volumes:
  core_pgdata:
  core_redis_data:
  prometheus_data:
  grafana_data:

networks:
  vninvest_network:
    driver: bridge
  nginx-proxy_default:
    external: true
