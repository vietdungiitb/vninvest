# ============================================================
# SaaS Production Compose — VNInvest
# Loại bỏ hoàn toàn legacy containers (backend, celery_worker,
# celery_beat, db, redis, mailpit). Core-api là backend duy nhất.
#
# Usage (Portainer / server):
#   docker compose up -d
#
# Required env vars (set in .env.production hoặc Portainer env):
#   CORE_DB_PASSWORD, CORE_DJANGO_SECRET_KEY, CORE_ALLOWED_HOSTS,
#   CORE_CORS_ALLOWED_ORIGINS, CORE_PAT_PEPPER,
#   GRAFANA_ADMIN_PASSWORD, APP_RELEASE, DOMAIN, LETSENCRYPT_EMAIL
# ============================================================
services:

  # ── Core database (PostgreSQL 16) ──────────────────────────
  core-db:
    image: postgres:16-alpine
    container_name: vninvest-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vninvest_core
      POSTGRES_USER: vninvest
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vninvest -d vninvest_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_DB_MEM_LIMIT:-1g}
    cpus: ${CORE_DB_CPUS:-1.0}

  # ── Core Redis ─────────────────────────────────────────────
  core-redis:
    image: redis:7-alpine
    container_name: vninvest-core-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - core_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vninvest_network
    mem_limit: ${CORE_REDIS_MEM_LIMIT:-512m}
    cpus: ${CORE_REDIS_CPUS:-0.5}

  # ── Core API (gunicorn) ────────────────────────────────────
  core-api:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-saas-prod}
    image: vninvest-core-api:${APP_RELEASE:-saas-prod}
    container_name: vninvest-core-api
    restart: unless-stopped
    environment:
      CORE_ENV: production
      CORE_API_PORT: "8100"
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORE_CORS_ALLOWED_ORIGINS:?CORE_CORS_ALLOWED_ORIGINS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      # No legacy DB — SaaS-only deployment
      REDIS_URL: redis://core-redis:6379/0
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    command: ["api"]
    depends_on:
      core-db:
        condition: service_healthy
      core-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8100/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    expose:
      - "8100"
    networks:
      - vninvest_network
    mem_limit: ${CORE_API_MEM_LIMIT:-512m}
    cpus: ${CORE_API_CPUS:-1.0}

  # ── Core Celery Worker ─────────────────────────────────────
  core-worker:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-saas-prod}
    image: vninvest-core-api:${APP_RELEASE:-saas-prod}
    container_name: vninvest-core-worker
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/0
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    command: ["worker"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_WORKER_MEM_LIMIT:-256m}
    cpus: ${CORE_WORKER_CPUS:-0.5}

  # ── Core Celery Beat ───────────────────────────────────────
  core-beat:
    build:
      context: ./packages/core/backend
      dockerfile: Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-saas-prod}
    image: vninvest-core-api:${APP_RELEASE:-saas-prod}
    container_name: vninvest-core-beat
    restart: unless-stopped
    environment:
      CORE_ENV: production
      DJANGO_SECRET_KEY: ${CORE_DJANGO_SECRET_KEY:?CORE_DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?CORE_ALLOWED_HOSTS must be set}
      CORE_DATABASE_URL: postgresql://vninvest:${CORE_DB_PASSWORD:?CORE_DB_PASSWORD must be set}@core-db:5432/vninvest_core
      REDIS_URL: redis://core-redis:6379/0
      CORE_PAT_PEPPER: ${CORE_PAT_PEPPER:?CORE_PAT_PEPPER must be set}
    command: ["beat"]
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - vninvest_network
    mem_limit: ${CORE_BEAT_MEM_LIMIT:-128m}
    cpus: ${CORE_BEAT_CPUS:-0.25}

  # ── Frontend (nginx + React + packages/web shell) ──────────
  # Dùng Dockerfile.dev-package-shell: nhúng packages/web vào build.
  # REACT_APP_ENABLE_PACKAGE_SHELL_HOST=1 bật ShellHost routes (DashboardShellHost, v.v.)
  # ModernDashboard là default (InterfaceContext default = 'modern').
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev-package-shell
      args:
        REACT_APP_API_BASE_URL: /api
        REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
        REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
        APP_RELEASE: ${APP_RELEASE:-saas-prod}
    image: vninvest-frontend:${APP_RELEASE:-saas-prod}
    container_name: vninvest-frontend
    restart: unless-stopped
    environment:
      APP_RELEASE: ${APP_RELEASE:-saas-prod}
      REACT_APP_API_BASE_URL: /api
      REACT_APP_ENABLE_PACKAGE_SHELL_HOST: "1"
      REACT_APP_PACKAGE_SHELL_CORE_BASE_URL: /core/v1
      VIRTUAL_HOST: ${DOMAIN:-vninvest.edusuccess.vn}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN:-vninvest.edusuccess.vn}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@edusuccess.vn}
    depends_on:
      core-api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - vninvest_network
      - nginx-proxy_default
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}
    labels:
      com.vninvest.release: ${APP_RELEASE:-saas-prod}

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vninvest-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - vninvest_network
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPUS:-0.5}

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: vninvest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://vninvest.edusuccess.vn/grafana}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    expose:
      - "3000"
    networks:
      - vninvest_network
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.25}

volumes:
  core_pgdata:
  core_redis_data:
  prometheus_data:
  grafana_data:

networks:
  vninvest_network:
    driver: bridge
  nginx-proxy_default:
    external: true
