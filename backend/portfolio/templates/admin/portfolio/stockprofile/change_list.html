{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {{ block.super }}
  <li>
    <form method="post" action="{% url 'admin:stock-profile-sync' %}" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:12px;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <select name="mode" style="min-width:150px; padding:6px 10px; border:1px solid #cbd5e1; border-radius:999px;">
        <option value="all">Tat ca</option>
        <option value="sectors">Nhom nganh</option>
        <option value="caps">Nhom von hoa</option>
        <option value="manual">Manual fallback</option>
      </select>
      <button type="submit" class="button">Đồng bộ Hồ sơ mã chứng khoán</button>
    </form>
  </li>
{% endblock %}
