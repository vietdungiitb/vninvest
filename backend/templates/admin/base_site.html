{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* Only control table overflow; avoid overriding Django changelist layout. */
  .change-list #changelist,
  .change-list #changelist-form,
  .change-list #content-main {
    min-width: 0;
  }

  .change-list #changelist .results {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    box-sizing: border-box;
    -webkit-overflow-scrolling: touch;
  }

  .change-list #changelist #result_list {
    width: max-content;
    min-width: 100%;
  }

  .change-list #changelist #result_list th,
  .change-list #changelist #result_list td {
    white-space: nowrap;
  }
</style>
{% endblock %}
