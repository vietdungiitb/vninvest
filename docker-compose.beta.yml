# ============================================================
# Beta deployment — VNInvest (standalone)
#
# Deploy frontend-beta service for beta.edusuccess.vn alongside
# production without conflict. Standalone file — needs NO other
# compose file.
#
# Usage (on docker.edusuccess.vn):
#   cd /opt/vninvest
#   docker compose -f docker-compose.beta.yml build frontend-beta
#   docker compose -f docker-compose.beta.yml up -d frontend-beta
#
# To monitor beta logs:
#   docker logs -f vninvest-frontend-beta
#
# To check beta health:
#   curl https://beta.edusuccess.vn
#
# To stop beta (does NOT affect production):
#   docker compose -f docker-compose.beta.yml down frontend-beta
# ============================================================

services:
  frontend-beta:
    build:
      context: packages/web/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        APP_RELEASE: beta-${APP_RELEASE:-dev}
    image: vninvest-frontend:beta-${APP_RELEASE:-dev}
    container_name: vninvest-frontend-beta
    restart: unless-stopped
    environment:
      APP_RELEASE: beta-${APP_RELEASE:-dev}
      VIRTUAL_HOST: beta.edusuccess.vn
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: beta.edusuccess.vn
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@edusuccess.vn}
    expose:
      - "80"
    networks:
      - nginx-proxy_default
      - vninvest_network
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}
    labels:
      com.vninvest.release: beta-${APP_RELEASE:-dev}
      com.vninvest.env: beta

networks:
  nginx-proxy_default:
    external: true
    name: nginx-proxy_default
  vninvest_network:
    external: true
    name: vninvest_vninvest_network
